name: bodega_seremi

services:
  web:
    build: .
    image: bodega_seremi:1.0
    container_name: bodega_seremi_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: sistema_bodega.settings
      DJANGO_DB_PATH: /app/db/db.sqlite3
    volumes:
      - ./data/db:/app/db
      - static_data:/app/staticfiles
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/accounts/login/')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.26-alpine
    container_name: bodega_seremi_nginx
    restart: unless-stopped
    ports:
      - "8010:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  static_data:
